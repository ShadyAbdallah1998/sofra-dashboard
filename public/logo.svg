<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8E53;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA94D;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Main Circle Background -->
  <circle cx="100" cy="100" r="90" fill="url(#mainGradient)" filter="url(#shadow)"/>
  
  <!-- Plate Base -->
  <ellipse cx="100" cy="120" rx="55" ry="8" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="100" cy="100" r="50" fill="#FFFFFF" stroke="#FFF5EB" stroke-width="3"/>
  
  <!-- Fork (Left) -->
  <g transform="translate(60, 70)">
    <rect x="8" y="0" width="4" height="50" rx="2" fill="#FF6B6B"/>
    <rect x="2" y="0" width="2" height="20" rx="1" fill="#FF6B6B"/>
    <rect x="6" y="0" width="2" height="20" rx="1" fill="#FF6B6B"/>
    <rect x="10" y="0" width="2" height="20" rx="1" fill="#FF6B6B"/>
    <rect x="14" y="0" width="2" height="20" rx="1" fill="#FF6B6B"/>
  </g>
  
  <!-- Spoon (Right) -->
  <g transform="translate(120, 70)">
    <rect x="8" y="15" width="4" height="35" rx="2" fill="#FF8E53"/>
    <ellipse cx="10" cy="10" rx="8" ry="10" fill="#FF8E53"/>
  </g>
  
  <!-- Tech Circuit Elements -->
  <circle cx="45" cy="55" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="155" cy="55" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="45" cy="145" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="155" cy="145" r="3" fill="#FFFFFF" opacity="0.8"/>
  
  <line x1="45" y1="55" x2="60" y2="70" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <line x1="155" y1="55" x2="140" y2="70" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  
  <!-- Letter S -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">S</text>
</svg>