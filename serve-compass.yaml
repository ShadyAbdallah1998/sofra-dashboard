info:
  title: Serve compass
  description: Resturant management service
  version: "1.0"
  contact: {}
tags: []
servers:
  - url: /
  - url: /api
components:
  schemas:
    ErrorDto:
      type: object
      properties:
        statusCode:
          type: number
          description: HTTP Error code extension.
        error:
          type: string
          description: Explanation of the reason for the error which can be shown to a
            client user.
        message:
          type: array
          description: More details and corrective actions related to the error which can
            be shown to a client user.
          items:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
      description: Used when an API throws an Error, typically with a HTTP error
        response-code (4xx, 5xx)
      required:
        - statusCode
        - error
        - message
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          description: The email of the user
          example: test@example.com
        password:
          type: string
          description: The password of the user
          example: Password@123
        fullname:
          type: string
          description: The full name of the user
          example: User Name
        confirmPassword:
          type: string
          description: The confirm password of the user
          example: Password@123
        firstname:
          type: string
          description: The first name of the user
          example: User
        lastname:
          type: string
          description: The last name of the user
          example: Name
      required:
        - email
        - password
        - fullname
        - confirmPassword
    LoginDto:
      type: object
      properties:
        email:
          type: string
          description: The email of the user
          example: test@example.com
        password:
          type: string
          description: The password of the user
          example: Password@123
      required:
        - email
        - password
    UserDto:
      type: object
      properties:
        id:
          type: string
          description: The id of the user
          example: 98741050-596d-4f7c-b419-44675285c4f2
        email:
          type: object
          description: The email of the user
          example: john.doe@example.com
        emailVerified:
          type: boolean
          description: The email verified of the user
          example: true
        fullname:
          type: string
          description: The full name of the user
          example: John Doe
        role:
          type: string
          description: The role of the user
          example: moderator
          enum:
            - admin
            - moderator
            - staff
        firstname:
          type: string
          description: The first name of the user
          example: John
        lastname:
          type: string
          description: The last name of the user
          example: Doe
        picture:
          type: string
          description: The picture of the user
          example: https://example.com/picture.jpg
        joinedAt:
          format: date-time
          type: string
          description: The joined at of the user
          example: 2021-01-01
        lastUpdatedAt:
          format: date-time
          type: string
          description: The last updated at of the user
          example: 2021-01-01
      required:
        - id
        - email
        - emailVerified
        - fullname
        - joinedAt
        - lastUpdatedAt
    ChangeEmailDto:
      type: object
      properties:
        email:
          type: string
          description: The new email of the user
          example: test@example.com
        confirmEmail:
          type: string
          description: The confirm new email of the user
          example: test@example.com
        password:
          type: string
          description: The password of the user
          example: Password@123
      required:
        - email
        - confirmEmail
        - password
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          description: The current password of the user
          example: Password@123
        newPassword:
          type: string
          description: The new password of the user
          example: Password@123
        confirmPassword:
          type: string
          description: The confirm new password of the user
          example: Password@123
      required:
        - currentPassword
        - newPassword
        - confirmPassword
    SendVerifyEmailDto:
      type: object
      properties:
        email:
          type: string
          description: The email of the user
          example: test@example.com
      required:
        - email
    SendUpdatePasswordDto:
      type: object
      properties:
        email:
          type: string
          description: The email of the user
          example: test@example.com
      required:
        - email
    ResetPasswordDto:
      type: object
      properties:
        newPassword:
          type: string
          description: The new password of the user
          example: Password@123
      required:
        - newPassword
    UpdateUserDto:
      type: object
      properties:
        fullname:
          type: string
          description: The full name of the user
          example: John Doe
        firstname:
          type: string
          description: The first name of the user
          example: John
        lastname:
          type: string
          description: The last name of the user
          example: Doe
        picture:
          type: string
          description: The picture of the user
          example: https://example.com/picture.jpg
    AssignableRolesDto:
      type: object
      properties:
        id:
          type: string
          description: The ID of the role
          example: 123e4567-e89b-12d3-a456-426614174000
        description:
          type: string
          description: The description of the role
          example: This is a description of the role
        type:
          type: object
          description: The type of the role
          example: moderator
      required:
        - id
        - description
        - type
    AddUserRoleDto:
      type: object
      properties:
        email:
          type: string
          description: The email of the user to add the role to
          example: john.doe@example.com
        fullname:
          type: string
          description: The fullname of the user to add the role to
          example: John Doe
        roleId:
          type: string
          description: The ID of the role to add to the user
          example: 123e4567-e89b-12d3-a456-426614174000
      required:
        - email
        - fullname
        - roleId
    UpdateUserRoleDto:
      type: object
      properties:
        roleId:
          type: string
          description: The ID of the role to update the user to
          example: 123e4567-e89b-12d3-a456-426614174000
      required:
        - roleId
    PaginationMetadataDto:
      type: object
      properties:
        page:
          type: number
          description: Current page number
          example: 1
        perPage:
          type: number
          description: Number of items per page
          example: 10
        total:
          type: number
          description: Total number of items
          example: 100
        lastPage:
          type: number
          description: Last page number
          example: 10
      required:
        - page
        - perPage
        - total
        - lastPage
    CategoryDto:
      type: object
      properties:
        id:
          type: string
          description: The id of the category
          example: 98741050-596d-4f7c-b419-44675285c4f2
        name:
          type: string
          description: The name of the category
          example: Burgers
        order:
          type: number
          description: The visible order of the category
          example: 1
        isActive:
          type: boolean
          description: The visibility of the category
          example: true
        description:
          type: string
          description: The description of the category
          example: Burgers with fries
        image:
          type: string
          description: The image of the category
        createdAt:
          format: date-time
          type: string
          description: The date the category was created
          example: 2021-01-01
        updatedAt:
          format: date-time
          type: string
          description: The date the category was updated
          example: 2021-01-01
        createdBy:
          type: string
          description: The user who created the category
          example: moderator@restaurant.com
        updatedBy:
          type: string
          description: The user who updated the category
          example: admin@restaurant.com
      required:
        - id
        - name
        - order
        - isActive
        - description
        - image
        - createdAt
        - updatedAt
        - createdBy
        - updatedBy
    PaginatedCategoriesDto:
      type: object
      properties:
        metadata:
          description: Pagination metadata
          allOf:
            - $ref: "#/components/schemas/PaginationMetadataDto"
        data:
          description: The paginated categories
          type: array
          items:
            $ref: "#/components/schemas/CategoryDto"
      required:
        - metadata
        - data
    CreateCategoryDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the category
          example: Burgers
        order:
          type: number
          description: The order of the category
          example: 1
        isActive:
          type: boolean
          description: Whether the category is active
          example: true
        description:
          type: string
          description: The description of the category
          example: Burgers with fries
        image:
          type: string
          description: The image of the category
          example: https://example.com/image.jpg
        createdBy:
          type: string
          description: The user who created the category
          example: moderator@restaurant.com
      required:
        - name
        - isActive
        - createdBy
    UpdateCategoryDto:
      type: object
